{% extends "base/base.html" %}{% block title %}Sign in · LoanCRM{% endblock %}
{% block content %}
<div class="login-wrap"><div class="card login-card shadow-sm p-4">
  <h4 class="text-center mb-1"><i class="bi bi-bank2 text-primary"></i> LoanCRM</h4>
  <p class="text-center text-muted small">Loan Sales &amp; Call Centre CRM</p>
  <form method="post" novalidate>{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    {% if form.errors %}<div class="alert alert-danger py-2">Invalid username or password.</div>{% endif %}
    <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" autofocus required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Sign in</button>
  </form></div></div>
{% endblock %}
