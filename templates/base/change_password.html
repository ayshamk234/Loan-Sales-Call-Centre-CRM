{% extends "base/base.html" %}{% block sidebar %}{% include "base/_nav.html" %}{% endblock %}
{% block content %}<div class="card p-4 mx-auto" style="max-width:480px"><h5>Change password</h5>
<form method="post">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary">Update</button></form></div>{% endblock %}
